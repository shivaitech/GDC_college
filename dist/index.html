    <!-- Google Translate hidden element -->
    <div id="google_translate_element" style="display: none"></div>

    <div id="root"></div>

    <!-- Google Translate Widget -->
    <script type="text/javascript">
      // ── Suppress GT toolbar bar + body shift ────────────────────────────
      function _killGTBar() {
        var frames = document.querySelectorAll(
          ".goog-te-banner-frame, iframe.skiptranslate",
        );
        frames.forEach(function (f) {
          f.style.cssText =
            "display:none!important;visibility:hidden!important;";
        });
        if (document.body) {
          document.body.style.top = "0px";
          document.body.style.marginTop = "0px";
        }
        document.documentElement.style.removeProperty("top");
      }

      var _killTimer = setInterval(_killGTBar, 100);
      setTimeout(function () {
        clearInterval(_killTimer);
      }, 6000);

      document.addEventListener("DOMContentLoaded", function () {
        var obs = new MutationObserver(_killGTBar);
        obs.observe(document.body, { childList: true, subtree: false });
      });

      // ── Set googtrans cookie (primary GT mechanism, survives reload) ─────
      // Source is always 'hi' because all page content is written in Hindi
      function _setGTCookie(lang) {
        var val = "/hi/" + lang; // e.g. /hi/en or /hi/hi
        document.cookie = "googtrans=" + val + "; path=/";
        try {
          document.cookie =
            "googtrans=" + val + "; path=/; domain=" + window.location.hostname;
        } catch (e) {}
      }

      // ── Translation init ──────────────────────────────────────────────────
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "hi", // actual content language is Hindi
            includedLanguages: "hi,en",
            autoDisplay: false,
            multilanguagePage: false,
            gaTrack: false,
          },
          "google_translate_element",
        );

        // Apply saved/default language after widget is ready
        var savedLang = localStorage.getItem("gdc_lang") || "hi";
        _setGTCookie(savedLang);
        _applyLangViaCombo(savedLang, 0);
      }

      // Retry-based combo select (GT may not render immediately)
      function _applyLangViaCombo(lang, attempt) {
        var sel = document.querySelector(".goog-te-combo");
        if (sel) {
          sel.value = lang;
          sel.dispatchEvent(new Event("change"));
          setTimeout(_killGTBar, 300);
          setTimeout(_killGTBar, 900);
        } else if (attempt < 25) {
          setTimeout(function () {
            _applyLangViaCombo(lang, attempt + 1);
          }, 200);
        }
      }

      // ── Global helpers used by React ──────────────────────────────────────
      window._gdcSetLang = function (lang) {
        localStorage.setItem("gdc_lang", lang);
        _setGTCookie(lang);
        // Notify React components so they can sync state
        window.dispatchEvent(
          new CustomEvent("gdcLangChange", { detail: { lang: lang } }),
        );
        _applyLangViaCombo(lang, 0);
      };

      window._gdcGetLang = function () {
        var stored = localStorage.getItem("gdc_lang");
        if (stored) return stored;
        // Fallback: read from googtrans cookie
        var c = document.cookie.split(";").find(function (s) {
          return s.trim().indexOf("googtrans=") === 0;
        });
        if (c) {
          var parts = decodeURIComponent(c.trim().split("=")[1] || "").split(
            "/",
          );
          var target = parts[parts.length - 1];
          if (target && target.length === 2 && target !== "en") return target;
        }
        return "hi";
      };
    </script>
